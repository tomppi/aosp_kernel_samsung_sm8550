name: Build q5q kernel (ReSukiSU, KPM, SUSFS, ZeroMount)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pins verified together by the ZeroMount/Super-Builders Android 13/5.15 stack.
  RESUKISU_COMMIT: 47167aa71e1d3d29c15fa7bff762ee9d9940e72f
  SUPER_BUILDERS_COMMIT: c2cb71614868fe742cbffee2b6f3126523432673

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up the toolchain
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip unzip wget \
            python3 python-is-python3 tar perl lz4 jq

      - name: Download anykernel.zip
        run: |
          set -euxo pipefail
          wget -q https://github.com/gyabii/kernel_samsung_sm8550-common/releases/download/anykernel/anykernel.zip

      - name: Apply pinned ReSukiSU, enhanced SUSFS and ZeroMount
        run: |
          set -euxo pipefail

          SUBLEVEL="$(grep -m1 '^SUBLEVEL =' ./Makefile | awk '{print $3}')"
          echo "KERNEL_VERSION=$SUBLEVEL" >> "$GITHUB_ENV"

          # Run the setup script and check out the exact ReSukiSU revision
          # used by the pinned Android 13/5.15 ZeroMount patch stack.
          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${RESUKISU_COMMIT}/kernel/setup.sh" \
            | bash -s "$RESUKISU_COMMIT"

          test -d KernelSU
          test "$(git -C KernelSU rev-parse HEAD)" = "$RESUKISU_COMMIT"

          # Fetch only the pinned Super-Builders commit. This prevents an
          # upstream change from silently changing a later kernel rebuild.
          PATCH_REPO="$GITHUB_WORKSPACE/zeromount-patches"
          git init "$PATCH_REPO"
          git -C "$PATCH_REPO" remote add origin https://github.com/Enginex0/Super-Builders.git
          git -C "$PATCH_REPO" fetch --depth=1 origin "$SUPER_BUILDERS_COMMIT"
          git -C "$PATCH_REPO" checkout --detach FETCH_HEAD
          test "$(git -C "$PATCH_REPO" rev-parse HEAD)" = "$SUPER_BUILDERS_COMMIT"

          PATCH_ROOT="$PATCH_REPO/android13-5.15/ReSukiSU/patches"
          BASE_SUSFS="$PATCH_ROOT/50_add_susfs_in_gki-android13-5.15.patch"
          ENHANCED_SUSFS="$PATCH_ROOT/51_enhanced_susfs-android13-5.15.patch"
          KSU_SAFETY="$PATCH_ROOT/70_ksu_safety-resukisu-5.15.patch"
          ZEROMOUNT="$PATCH_ROOT/60_zeromount-android13-5.15.patch"

          for patch_file in \
            "$BASE_SUSFS" \
            "$ENHANCED_SUSFS" \
            "$KSU_SAFETY" \
            "$ZEROMOUNT"; do
            test -s "$patch_file"
            echo "Found: $patch_file"
          done

          # Required application order:
          # base SUSFS -> enhanced SUSFS -> ReSukiSU safety -> ZeroMount.
          patch -p1 -F3 --no-backup-if-mismatch < "$BASE_SUSFS"
          patch -p1 -F3 --no-backup-if-mismatch < "$ENHANCED_SUSFS"
          (
            cd KernelSU
            patch -p1 --no-backup-if-mismatch < "$KSU_SAFETY"
          )
          patch -p1 -F3 --no-backup-if-mismatch < "$ZEROMOUNT"

          COMPAT_SCRIPT="$PATCH_REPO/android13-5.15/build-helpers/fix-susfs-compat.sh"
          if [ -f "$COMPAT_SCRIPT" ]; then
            bash "$COMPAT_SCRIPT" . "$SUBLEVEL" android13 5.15 ""
          fi

          # Never continue with a partially applied VFS/SUSFS patch stack.
          mapfile -t REJECTS < <(find . -type f -name '*.rej' -print)
          if [ "${#REJECTS[@]}" -ne 0 ]; then
            printf 'Patch reject: %s\n' "${REJECTS[@]}"
            for reject in "${REJECTS[@]}"; do
              echo "===== $reject ====="
              cat "$reject"
            done
            exit 1
          fi

          for required_file in \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            fs/zeromount.c \
            include/linux/zeromount.h; do
            test -s "$required_file"
            echo "Found: $required_file"
          done

          CONFIG_FILE="arch/arm64/configs/q5q_defconfig"
          test -f "$CONFIG_FILE"

          set_config() {
            local entry="$1"
            local key="${entry%%=*}"
            sed -i \
              -e "/^${key}=.*/d" \
              -e "/^# ${key} is not set$/d" \
              "$CONFIG_FILE"
            printf '%s\n' "$entry" >> "$CONFIG_FILE"
          }

          while IFS= read -r entry; do
            [ -n "$entry" ] && set_config "$entry"
          done << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_UNICODE_FILTER=y
          CONFIG_KSU_SUSFS_HIDDEN_NAME=y
          CONFIG_KSU_SUSFS_HARDENED=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_ZEROMOUNT=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KPM=y
          EOF

          echo "Enabled q5q ZeroMount/SUSFS configuration:"
          grep -E 'CONFIG_(ZEROMOUNT|KSU_SUSFS|TMPFS_XATTR|TMPFS_POSIX_ACL|OVERLAY_FS)=' "$CONFIG_FILE" || true

          rm -rf "$PATCH_REPO"

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Build the q5q kernel
        run: |
          set -euxo pipefail
          git config --global user.email "gyabii@proton.me"
          git config --global user.name "gyabii"
          chmod +x scripts/build.sh
          KERNEL_DEFCONFIG=q5q_defconfig ./scripts/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify built ZeroMount configuration
        run: |
          set -euxo pipefail

          CONFIG_CANDIDATE=""
          for candidate in \
            out/.config \
            out/arch/arm64/configs/q5q_defconfig \
            arch/arm64/configs/q5q_defconfig; do
            if [ -f "$candidate" ]; then
              CONFIG_CANDIDATE="$candidate"
              break
            fi
          done

          test -n "$CONFIG_CANDIDATE"
          grep -q '^CONFIG_ZEROMOUNT=y$' "$CONFIG_CANDIDATE"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$CONFIG_CANDIDATE"
          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y$' "$CONFIG_CANDIDATE"
          grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y$' "$CONFIG_CANDIDATE"
          echo "Verified configuration in $CONFIG_CANDIDATE"

      - name: KPM patching
        run: |
          set -euxo pipefail
          cd out/arch/arm64/boot

          # URL intentionally kept hardcoded.
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
          chmod +x patch

          test -f Image.gz
          gunzip -f Image.gz
          test -f Image
          ./patch Image
          rm -f Image
          mv oImage Image
          gzip -f Image

      - name: Package image with AnyKernel3
        id: package
        run: |
          set -euxo pipefail

          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

          unzip "anykernel.zip" -d anykernel/
          cp out/arch/arm64/boot/Image.gz anykernel/

          if [ -f anykernel/anykernel.sh ]; then
            sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' anykernel/anykernel.sh || true
            sed -i 's/^device.name1=.*/device.name1=q5q/' anykernel/anykernel.sh || true
            sed -i 's/^device.name2=.*/device.name2=/' anykernel/anykernel.sh || true
            sed -i 's/^device.name3=.*/device.name3=/' anykernel/anykernel.sh || true
            sed -i 's/^device.name4=.*/device.name4=/' anykernel/anykernel.sh || true
            sed -i 's/^device.name5=.*/device.name5=/' anykernel/anykernel.sh || true
            sed -i 's|^BLOCK=.*|BLOCK=auto;|' anykernel/anykernel.sh || true
            sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' anykernel/anykernel.sh || true

            if ! grep -q '^device.name1=q5q' anykernel/anykernel.sh; then
              printf '\n%s\n%s\n%s\n%s\n' \
                'do.devicecheck=1' \
                'device.name1=q5q' \
                'BLOCK=auto;' \
                'IS_SLOT_DEVICE=auto;' >> anykernel/anykernel.sh
            fi
          else
            echo "anykernel.sh missing from template"
            exit 1
          fi

          ZIP_NAME="q5q-aosp-5.15.${KERNEL_VERSION}-gyabii_resukisu-kpm-susfs-zeromount-$(date +%d%m%y-%H%M%S)"
          cd anykernel
          zip -r0 "../${ZIP_NAME}.zip" ./*
          echo "zip_path=$GITHUB_WORKSPACE/${ZIP_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          cd ..

      - name: Upload raw q5q Image.gz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q5q-resukisu-kpm-susfs-zeromount-Image.gz
          path: out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
          compression-level: 0

      - name: Upload the flashable q5q kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q5q-resukisu-zeromount-build-log
          path: build.log
          if-no-files-found: warn
