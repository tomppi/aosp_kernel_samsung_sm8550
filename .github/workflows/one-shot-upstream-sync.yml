name: One-shot Exynoobs upstream sync

on:
  push:
    branches:
      - agent/run-exynoobs-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Exynoobs lineage-23.2
        shell: bash
        run: |
          set -euo pipefail

          TARGET_BRANCH="agent/sync-exynoobs-lineage-23.2"
          UPSTREAM_URL="https://github.com/Exynoobs/android_kernel_samsung_sm8550.git"
          UPSTREAM_BRANCH="lineage-23.2"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove exynoobs 2>/dev/null || true
          git remote add exynoobs "$UPSTREAM_URL"
          git fetch --no-tags exynoobs "$UPSTREAM_BRANCH"
          git fetch --no-tags origin lineage-23.2

          git checkout -B "$TARGET_BRANCH" origin/lineage-23.2

          set +e
          git merge --no-ff -X ours "exynoobs/$UPSTREAM_BRANCH" \
            -m "Merge Exynoobs lineage-23.2 upstream"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -d '' conflicts < <(git diff --name-only --diff-filter=U -z)

            {
              echo "## Automatically retained local versions for unresolved conflicts"
              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo "No unresolved paths were reported."
              else
                printf -- '- `%s`\n' "${conflicts[@]}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            for path in "${conflicts[@]}"; do
              if git checkout --ours -- "$path" 2>/dev/null; then
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain:" >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi

            git commit -m "Merge Exynoobs lineage-23.2 upstream"
          fi

          {
            echo "## Sync result"
            echo
            echo "- Local base: $(git rev-parse HEAD^1)"
            echo "- Exynoobs parent: $(git rev-parse HEAD^2)"
            echo "- Merge commit: $(git rev-parse HEAD)"
            echo "- Files changed against local base: $(git diff --name-only HEAD^1..HEAD | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

          git push --force-with-lease origin \
            "HEAD:refs/heads/$TARGET_BRANCH"
